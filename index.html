<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekap Bukti Dukung SKP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#16252d;--mut:#5d6f78;--line:#d3dde2;--pri:#0f5c6e;--pri2:#0b4553;--ok:#1d7a4d;--bad:#b3261e;--hl:#e3f1f4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#97aab3;--line:#2a3d46;--pri:#4fb3c8;--pri2:#7cc9da;--hl:#1b3640;--ok:#5cc08f;--bad:#f2837c}}
*{box-sizing:border-box}
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--pri);color:#fff;padding:18px 20px}
@media(prefers-color-scheme:dark){header{background:#12333d}}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:1.25rem;margin:0;font-weight:700}
header small{opacity:.85}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){main{grid-template-columns:420px minmax(0,1fr);align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:1rem;margin:0 0 12px}
label{display:block;font-size:.82rem;font-weight:600;margin:10px 0 4px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){button{color:#0b1b21}}
button:hover{background:var(--pri2)}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
button.ghost:hover{background:var(--hl)}
button.del{color:var(--bad)}
button:disabled{opacity:.55;cursor:wait}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar input[type=month]{width:auto}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.item h3{margin:0 0 2px;font-size:.98rem}
.item .meta{color:var(--mut);font-size:.82rem;margin-bottom:6px}
.item dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:.88rem}
.item dt{color:var(--mut)}.item dd{margin:0;white-space:pre-wrap;word-break:break-word}
.item a{color:var(--pri)}
.item .acts{margin-top:10px}.item button{padding:5px 10px;font-size:.82rem}
.empty{color:var(--mut);text-align:center;padding:28px 10px}
.stat{font-size:.88rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;display:none;max-width:90vw;z-index:9}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:480px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
.hint{font-size:.78rem;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>Rekap Bukti Dukung SKP</h1><small>Catat kegiatan harian, simpan otomatis ke Google Sheets dan Google Docs</small></div>
  <button class="ghost" id="btnSet" style="color:#fff;border-color:rgba(255,255,255,.5)">Pengaturan</button>
</div></header>

<main>
<section class="card">
  <h2 id="formTitle">Tambah kegiatan</h2>
  <form id="f" autocomplete="off">
    <input type="hidden" id="id">
    <label for="uraianPekerjaan">Uraian pekerjaan (rencana hasil kerja SKP)</label>
    <textarea id="uraianPekerjaan" required></textarea>
    <div class="row">
      <div><label for="tanggal">Tanggal</label><input type="date" id="tanggal" required></div>
      <div><label for="jamMulai">Mulai</label><input type="time" id="jamMulai" required></div>
      <div><label for="jamSelesai">Selesai</label><input type="time" id="jamSelesai" required></div>
    </div>
    <label for="tempat">Tempat pelaksanaan</label><input id="tempat" required>
    <label for="pemangku">Pemangku kepentingan</label><input id="pemangku" required>
    <label for="kegiatan">Kegiatan</label><input id="kegiatan" required>
    <label for="uraian">Uraian kegiatan</label><textarea id="uraian" required></textarea>
    <label for="hasil">Hasil yang didapat</label><textarea id="hasil" required></textarea>
    <label for="bukti">Bukti dukung (tautan atau keterangan)</label><textarea id="bukti" style="min-height:50px"></textarea>
    <label for="files">Unggah file bukti (opsional, tersimpan ke Drive)</label>
    <input type="file" id="files" multiple>
    <div class="hint">Gunakan file kecil (maks. sekitar 5 MB per file).</div>
    <div class="acts">
      <button type="submit" id="btnSave">Simpan kegiatan</button>
      <button type="button" class="ghost" id="btnReset">Kosongkan form</button>
    </div>
  </form>
</section>

<section class="card">
  <div class="bar">
    <div><label for="bulan" style="margin:0 0 4px">Bulan rekap</label><input type="month" id="bulan"></div>
    <button id="btnDoc">Buat dokumen bulan ini</button>
  </div>
  <div class="stat" id="stat"></div>
  <div id="list" style="margin-top:12px"></div>
</section>
</main>

<dialog id="dlg">
  <form method="dialog" id="fs">
    <h2>Pengaturan</h2>
    <label for="url">URL Web App Google Apps Script</label>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="nama">Nama (untuk kop dokumen)</label><input id="nama">
    <label for="nip">NIP</label><input id="nip">
    <div class="hint">Tersimpan di browser ini saja. Untuk mengisi permanen, ubah nilai DEFAULT_URL di file ini.</div>
    <div class="acts"><button value="ok" id="sv">Simpan</button><button value="cancel" class="ghost">Tutup</button></div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const DEFAULT_URL = ''; // tempel URL Web App di sini bila ingin permanen
const $ = id => document.getElementById(id);
const BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const FIELDS = ['id','tanggal','jamMulai','jamSelesai','tempat','uraianPekerjaan','pemangku','kegiatan','uraian','hasil','bukti'];
let data = [];
const cfg = k => { try { return localStorage.getItem(k) || '' } catch (e) { return '' } };
const setCfg = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} };
const apiUrl = () => cfg('url') || DEFAULT_URL;

function toast(m, ms = 3000) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function tgl(s) { const [y, m, d] = s.split('-'); return `${+d} ${BLN[+m - 1]} ${y}`; }

async function call(body) {
  if (!apiUrl()) { $('dlg').showModal(); throw new Error('Isi URL Web App di Pengaturan dulu.'); }
  const r = await fetch(apiUrl(), { method: 'POST', body: JSON.stringify(body) }); // text/plain: tanpa preflight CORS
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan'); return j;
}
async function load() {
  if (!apiUrl()) { $('list').innerHTML = '<div class="empty">Buka Pengaturan, lalu tempel URL Web App Anda.</div>'; return; }
  $('list').innerHTML = '<div class="empty">Memuat data…</div>';
  try {
    const r = await fetch(apiUrl() + '?bulan=' + $('bulan').value); const j = await r.json();
    if (!j.ok) throw new Error(j.error); data = j.data; render();
  } catch (e) { $('list').innerHTML = '<div class="empty">Gagal memuat: ' + esc(e.message) + '</div>'; }
}
function render() {
  const [y, m] = $('bulan').value.split('-');
  $('stat').textContent = `${BLN[m - 1]} ${y}: ${data.length} kegiatan, ${new Set(data.map(d => d.tanggal)).size} hari terisi`;
  if (!data.length) { $('list').innerHTML = '<div class="empty">Belum ada kegiatan di bulan ini. Isi form di samping untuk menambah.</div>'; return; }
  $('list').innerHTML = data.map(d => `<article class="item">
    <h3>${esc(d.kegiatan)}</h3>
    <div class="meta">${tgl(d.tanggal)}, ${d.jamMulai} - ${d.jamSelesai} WIB</div>
    <dl><dt>Uraian pekerjaan</dt><dd>${esc(d.uraianPekerjaan)}</dd>
    <dt>Tempat</dt><dd>${esc(d.tempat)}</dd>
    <dt>Pemangku kepentingan</dt><dd>${esc(d.pemangku)}</dd>
    <dt>Uraian kegiatan</dt><dd>${esc(d.uraian)}</dd>
    <dt>Hasil</dt><dd>${esc(d.hasil)}</dd>
    <dt>Bukti dukung</dt><dd>${linkify(d.bukti) || '-'}</dd></dl>
    <div class="acts"><button class="ghost" data-e="${d.id}">Ubah</button><button class="ghost del" data-d="${d.id}">Hapus</button></div>
  </article>`).join('');
}
function resetForm() {
  $('f').reset(); $('id').value = ''; $('formTitle').textContent = 'Tambah kegiatan';
  const b = $('bulan').value; if (b && !$('tanggal').value) $('tanggal').value = (b === new Date().toISOString().slice(0, 7)) ? new Date().toISOString().slice(0, 10) : b + '-01';
}
const readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ name: f.name, mime: f.type || 'application/octet-stream', data: r.result.split(',')[1] }); r.onerror = rej; r.readAsDataURL(f); });

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const item = {}; FIELDS.forEach(k => item[k] = $(k).value.trim());
  if (!item.tanggal.startsWith($('bulan').value)) { toast('Tanggal harus berada di bulan rekap yang dipilih.'); return; }
  item.bulan = item.tanggal.slice(0, 7);
  $('btnSave').disabled = true; $('btnSave').textContent = 'Menyimpan…';
  try {
    const files = await Promise.all([...$('files').files].map(readFile));
    await call({ action: 'save', item, files });
    toast('Kegiatan tersimpan'); const t = item.tanggal; resetForm(); $('tanggal').value = t; await load();
  } catch (err) { toast(err.message, 5000); }
  $('btnSave').disabled = false; $('btnSave').textContent = 'Simpan kegiatan';
});
$('btnReset').onclick = resetForm;
$('bulan').onchange = () => { $('tanggal').value = ''; resetForm(); load(); };
$('list').addEventListener('click', async e => {
  const ed = e.target.dataset.e, dl = e.target.dataset.d;
  if (ed) { const d = data.find(x => x.id === ed); FIELDS.forEach(k => $(k).value = d[k] || ''); $('formTitle').textContent = 'Ubah kegiatan'; $('f').scrollIntoView({ behavior: 'smooth' }); }
  if (dl && confirm('Hapus kegiatan ini?')) { try { await call({ action: 'delete', id: dl }); toast('Kegiatan dihapus'); load(); } catch (err) { toast(err.message, 5000); } }
});
$('btnDoc').onclick = async () => {
  if (!data.length) { toast('Belum ada kegiatan untuk dibuat dokumen.'); return; }
  $('btnDoc').disabled = true; $('btnDoc').textContent = 'Membuat dokumen…';
  try {
    const j = await call({ action: 'doc', bulan: $('bulan').value, nama: cfg('nama'), nip: cfg('nip') });
    toast('Dokumen dibuat di Google Drive'); window.open(j.url, '_blank');
  } catch (err) { toast(err.message, 5000); }
  $('btnDoc').disabled = false; $('btnDoc').textContent = 'Buat dokumen bulan ini';
};
$('btnSet').onclick = () => { $('url').value = apiUrl(); $('nama').value = cfg('nama'); $('nip').value = cfg('nip'); $('dlg').showModal(); };
$('fs').addEventListener('submit', e => {
  if (e.submitter && e.submitter.value === 'ok') { setCfg('url', $('url').value.trim()); setCfg('nama', $('nama').value.trim()); setCfg('nip', $('nip').value.trim()); load(); }
});

$('bulan').value = new Date().toISOString().slice(0, 7);
resetForm(); load();
</script>
</body>
</html>
